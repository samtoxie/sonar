# Publish a release to the AUR: `sonar` (built from the tag's source) and
# `sonar-bin` (the release's .deb). `sonar-git` builds the latest commit by
# itself and needs no update.
#
# Runs when a release is published (the Build workflow has attached the .deb
# to the draft by then), or by hand for a tag. Needs the secret AUR_SSH_KEY:
# a private key whose public half is in the AUR account (only for this).
# The updated PKGBUILDs are committed back to packaging/aur/ on main.

name: AUR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.2.0)
        required: true

permissions:
  contents: write # commit the updated PKGBUILDs

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to the AUR
    runs-on: ubuntu-24.04
    # Settings → Environments → aur: add yourself as a required reviewer to
    # approve each publish.
    environment: aur
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: |
          pacman -Syu --noconfirm --needed git openssh pacman-contrib
          # makepkg refuses to run as root. Downloads go to SRCDEST, not
          # next to the PKGBUILDs (which are committed back).
          useradd -m builder
          install -d -o builder /tmp/srcdest

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$TAG is not a vX.Y.Z release tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update the PKGBUILDs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder packaging/aur
          for pkg in sonar sonar-bin; do
            cd "packaging/aur/$pkg"
            sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
            # Downloads the tag's tarball and the release's .deb.
            sudo -u builder SRCDEST=/tmp/srcdest updpkgsums
            sudo -u builder makepkg --printsrcinfo > .SRCINFO
            cd - > /dev/null
          done

      - name: Test sonar-bin
        # Quick: it only unpacks the .deb. (-d: the runtime dependencies
        # aren't needed to package it.)
        run: |
          cp -r packaging/aur/sonar-bin /tmp/test-bin
          chown -R builder /tmp/test-bin
          cd /tmp/test-bin
          sudo -u builder SRCDEST=/tmp/srcdest makepkg -d --noconfirm
          tar -tf sonar-bin-*.pkg.tar* | grep -qx 'usr/bin/sonar'

      - name: Push to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::error::The AUR_SSH_KEY secret is not set"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pinned: the key aur.archlinux.org publishes (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4).
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          # In a container job $HOME (/github/home) is not the passwd home ssh reads, so name the files.
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          git config --global user.name samtoxie
          git config --global user.email sam@toxopeus.it
          for pkg in sonar sonar-bin; do
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "/tmp/aur-$pkg"
            cp "packaging/aur/$pkg/PKGBUILD" "packaging/aur/$pkg/.SRCINFO" "/tmp/aur-$pkg/"
            cd "/tmp/aur-$pkg"
            git add PKGBUILD .SRCINFO
            if git diff --cached --quiet; then
              echo "$pkg is already at $VERSION"
            else
              git commit -m "Update to $VERSION"
              git push origin master
            fi
            cd - > /dev/null
          done

      - name: Commit the PKGBUILDs to main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name samtoxie
          git config user.email sam@toxopeus.it
          git add packaging/aur
          if ! git diff --cached --quiet; then
            git commit -m "AUR: sonar $VERSION"
            git push origin HEAD:main
          fi
